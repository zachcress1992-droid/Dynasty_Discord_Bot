name: Post Season Preview to Discord

on:
  workflow_dispatch:

jobs:
  post-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord webhook message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import urllib.request
          import urllib.error

          page_url = os.environ["PAGES_URL"].rstrip("/") + "/preview.html"
          headline = "SEASON PREVIEW: TWELVE TEAMS, ONE REBRAND, ZERO GAMES PLAYED"
          teaser = (
              "¡Hola y bienvenidos! Me llamo Ricky Martin, and this league is "
              "officially mine to run. Rosters are locked, the lottery's been drawn, "
              "and Dr. Fumbles already owes the league an explanation. Twelve owners, "
              "one fake rookie class, and more than enough smoke to get us to Week 1."
          )
          content = f"**{headline}**\n\n{teaser}\n\nFull rundown: {page_url}"

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"].strip()
          print("Webhook host:", webhook_url.split("//")[-1].split("/")[0])
          print("Page URL being posted:", page_url)

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps({"content": content}).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (compatible; DynastyDiscordBot/1.0; +https://github.com/zachcress1992-droid/Dynasty_Discord_Bot)",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("Discord responded:", resp.status)
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print(f"Discord returned HTTP {e.code}")
              print("Response body:", body)
              raise
          EOF
